<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- GitHub Pages sends no security headers, so the page carries its own policy. 'wasm-unsafe-eval' runs the
             CAD reader; map tiles come from OpenStreetMap and Esri; nothing else is loaded from elsewhere. -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
        />
        <meta name="description" content="Single-line diagrams and DWG/DXF plant layouts for solar, wind, storage, hydro, substations and transmission, in your browser." />
        <meta name="theme-color" content="#0f766e" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <title>plantline</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
