<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- GitHub Pages sends no security headers, so the page carries its own policy. 'wasm-unsafe-eval' runs the
             CAD reader; map tiles come from OpenStreetMap and Esri; nothing else is loaded from elsewhere. -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: %TILE_ORIGINS%; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
        />
        <meta name="description" content="Single-line diagrams and DWG/DXF plant layouts for solar, wind, storage, hydro, substations and transmission, in your browser." />
        <meta name="theme-color" content="#15803d" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <!-- Link previews need the image's full address: a fork that hosts elsewhere changes these two -->
        <meta property="og:url" content="https://araminix.github.io/plantline/" />
        <meta property="og:image" content="https://araminix.github.io/plantline/social.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="plantline: single-line diagrams and DWG/DXF plant layouts in your browser" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="plantline" />
        <meta property="og:description" content="Single-line diagrams and DWG/DXF plant layouts for solar, wind, storage, hydro, substations and transmission, in your browser." />
        <meta name="twitter:card" content="summary_large_image" />
        <title>plantline</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
