name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Choose Solar PV\n2. Open a drawing…"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser, device and language
      placeholder: Chrome 140 on Android, Persian
  - type: markdown
    attributes:
      value: >
        Attach a drawing only if you have the right to share it publicly. A file that crashes or hangs the reader is a
        security issue: report it privately (see SECURITY.md).
